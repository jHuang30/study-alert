services:
  study-alert:
    build: .
    container_name: study-alert
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ALLOWED_HOSTS: "192.168.1.230:3001,localhost:3001,127.0.0.1:3001"
    volumes:
      - study-data:/app/.little-daily
volumes:
  study-data:
